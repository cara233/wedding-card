<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытка</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        video {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: black;
        }
    </style>
</head>

<body>

<video
    id="video"
    src="CotobusAnimation.mp4?v=2"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    controls>
</video>

<script>
    const video = document.getElementById("video");

    video.muted = true;

    video.play().catch(error => {
        console.log("Autoplay error:", error);
    });
</script>

</body>
</html>
